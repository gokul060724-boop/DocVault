<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DocVault - Create Password</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="logo">
            🔐
        </div>

        <h1>DocVault</h1>

        <p class="subtitle">
            Secure your account
        </p>


        <div class="login-box">

            <h2>Create Password</h2>

            <p class="login-text">
                Create a strong password for your DocVault account
            </p>


            <form id="passwordForm">

                <label for="accountPassword">
                    Account Password
                </label>

                <input
                    type="password"
                    id="accountPassword"
                    placeholder="Minimum 8 characters"
                    minlength="8"
                    required
                >


                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                    minlength="8"
                    required
                >


                <button type="submit" id="continueBtn">
                    Continue
                </button>

            </form>


            <div
                id="passwordMessage"
                style="
                    text-align: center;
                    margin-top: 18px;
                    font-size: 14px;
                "
            ></div>

        </div>


        <p class="security-note">
            🔒 Never share your account password with anyone.
        </p>

    </div>


    <script>

        const passwordForm =
            document.getElementById("passwordForm");

        const continueBtn =
            document.getElementById("continueBtn");

        const passwordMessage =
            document.getElementById("passwordMessage");


        passwordForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const password =
                    document.getElementById("accountPassword")
                    .value;


                const confirmPassword =
                    document.getElementById("confirmPassword")
                    .value;


                // Check password length
                if (password.length < 8) {

                    passwordMessage.textContent =
                        "❌ Password must be at least 8 characters.";

                    passwordMessage.style.color =
                        "#ef4444";

                    return;
                }


                // Check password match
                if (password !== confirmPassword) {

                    passwordMessage.textContent =
                        "❌ Passwords do not match.";

                    passwordMessage.style.color =
                        "#ef4444";

                    return;
                }


                passwordMessage.textContent =
                    "✅ Password confirmed.";

                passwordMessage.style.color =
                    "#22c55e";


                continueBtn.disabled = true;

                continueBtn.textContent =
                    "Continue";


                // Next step: Security PIN
                setTimeout(function () {

                    window.location.href =
                        "/create-pin.html";

                }, 700);

            }
        );

    </script>

</body>

</html>
